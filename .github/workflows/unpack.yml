name: Unpack zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q KoaOS-for-Heltec-V4.zip -d /tmp/x
          rsync -a --exclude .github /tmp/x/KoaOS-for-Heltec-V4/ ./
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files"
          git push
